<header class="topbar">
  <div class="container nav-shell">
    <a class="brand" href="#top" aria-label="Beatmatch home">
      <span class="brand-mark" aria-hidden="true">BM/</span> BEATMATCH
    </a>

    <button
      class="nav-toggle"
      type="button"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="nav" [class.is-open]="menuOpen()" aria-label="Main navigation">
      <div class="nav-links">
        @for (item of navItems; track item.href) {
          <a [href]="item.href" (click)="closeMenu()">{{ item.label }}</a>
        }
      </div>

      <a class="nav-cta" href="#waitlist" (click)="closeMenu()">Join the waitlist</a>
    </nav>
  </div>
</header>
